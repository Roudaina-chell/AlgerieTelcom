<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password - Algerie Telecom</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            margin: 0;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        
        .logo-background {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 220px;
            z-index: 999;
            transition: transform 0.4s ease, top 0.4s ease;
        }
        
        .container {
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-family: 'League Spartan', sans-serif;
            color: #003366;
            font-size: 26px;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 16px;
            color: #444;
            margin-bottom: 25px;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }
        
        input[type="email"]:focus {
            border-color: #003366;
            outline: none;
            box-shadow: 0 0 6px #003366;
        }
        
        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        button:hover {
            background-color: #003366;
            transform: translateY(-3px);
        }
        
        .back-link {
            display: block;
            margin-top: 15px;
            color: #003366;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <img src="logoalg.png" alt="Algerie Telecom Logo" class="logo-background" id="logo" />

    <div class="container">
        <h1>Forgot Password?</h1>
        <p>Enter your email and we'll send you a link to reset your password.</p>
        <form action="password-reset-sent.html" method="post">
            <input type="email" name="email" placeholder="you@example.com" required />
            <button type="submit">Send Reset Link</button>
        </form>
        <a href="cnx.html" class="back-link">Back to Login</a>
    </div>

</body>

</html>
