<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil - Elegant UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(to bottom right, #f0f4f8, #e6edf5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            animation: fadeInBody 1s ease-in-out forwards;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        .logo-background {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 220px;
            z-index: 999;
            transition: transform 0.4s ease, top 0.4s ease;
        }
        
        .logo-move-right {
            transform: translateX(300px) translateY(-5px);
        }
        
        #menu-toggle {
            position: fixed;
            top: 130px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            background: #003366;
            color: white;
            padding: 20px;
            border-radius: 5px;
            z-index: 2001;
            transition: transform 0.3s ease;
        }
        
        #menu-toggle:hover {
            transform: scale(1.05);
        }
        
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100%;
            background: linear-gradient(180deg, #022548, #033a6b);
            padding-top: 80px;
            transition: all 0.3s ease;
            transform: translateX(-100%);
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        
        #sidebar.active {
            transform: translateX(0);
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        
        #sidebar .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        #sidebar .close-btn:hover {
            transform: scale(1.1);
        }
        
        .sidebar-links {
            margin-top: 100px;
        }
        
        .sidebar-item,
        .dropdown-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 25px;
            font-size: 19px;
            color: white;
            text-decoration: none;
            background: none;
            border: none;
            text-align: left;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        
        .sidebar-item:hover,
        .dropdown-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #00aaff;
            padding-left: 30px;
        }
        
        .dropdown-btn .arrow {
            margin-left: auto;
            transition: transform 0.3s ease;
        }
        
        .dropdown-section.active .arrow {
            transform: rotate(90deg);
        }
        
        .dropdown-content {
            background: #04407a;
            padding-left: 10px;
            border-left: 2px solid #007acc;
            display: none;
        }
        
        .dropdown-content a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            font-size: 17px;
            color: #e0e0e0;
            text-decoration: none;
            transition: background 0.3s;
        }
        
        .dropdown-content a:hover {
            background-color: #005fa3;
            color: #ffffff;
        }
        
        .dropdown-section.active .dropdown-content {
            display: block;
        }
        
        .logout-section {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
        }
        
        .logout-section .sidebar-item {
            justify-content: center;
            color: #ffffff;
            background-color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border-radius: 8px;
            margin: 0 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .logout-section .sidebar-item:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        h2 {
            margin-bottom: 25px;
            color: #003366;
            text-align: center;
            font-size: 32px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: bold;
            color: #003366;
            margin-bottom: 10px;
            font-size: 18px;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        label:focus-within {
            transform: scale(1.05);
            color: #00aaff;
        }
        
        .dropdown-content {
            display: none;
            background: #003366;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
        
        .circle-bg {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, #d6e4f0 0%, transparent 60%);
            border-radius: 50%;
            top: -200px;
            left: -200px;
            z-index: 0;
        }
        
        .profile-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.4), 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 60px 30px 30px;
            width: 340px;
            position: relative;
            text-align: center;
            z-index: 1;
            animation: slideIn 1s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .profile-pic-container {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: white;
            border: 5px solid #003366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .profile-card h2 {
            margin: 70px 0 10px;
            font-size: 24px;
            color: #002244;
        }
        
        .profile-card p.title {
            font-size: 16px;
            color: #6b7b8c;
            margin-bottom: 15px;
        }
        
        .profile-card .info {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: #5a6b7b;
            gap: 5px;
            margin-bottom: 12px;
        }
        
        .profile-card .info i {
            font-style: normal;
            font-weight: bold;
        }
        
        .profile-card .buttons {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        
        .profile-card .buttons button {
            background: linear-gradient(to right, #002b5c, #0057a3);
            border: none;
            border-radius: 12px;
            padding: 10px 25px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0, 87, 163, 0.4);
            transition: 0.3s ease;
        }
        
        .profile-card .buttons button:hover {
            background: #0a3a80;
        }
    </style>
</head>


<body>

        <div class="sidebar-links">

                    <a href="affichage-user.html"><i data-lucide="eye"></i>Affichage</a>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const logo = document.getElementById("logo");
            sidebar.classList.toggle("active");
            logo.classList.toggle("logo-move-right", sidebar.classList.contains("active"));
        }
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const logo = document.getElementById("logo");
            sidebar.classList.toggle("active");
            logo.classList.toggle("logo-move-right");
        }

        document.querySelectorAll('.dropdown-btn').forEach((btn) => {
            btn.addEventListener('click', function() {
                const section = this.parentElement;
                section.classList.toggle('active');
            });
        });

        lucide.createIcons();
    </script>

</body>

</html>
