<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'Arial', sans-serif;
            color: #003366;
            height: 100vh;
            margin: 0;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        .logo-background {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 220px;
            z-index: 999;
            transition: transform 0.4s ease, top 0.4s ease;
        }
        
        .logo-move-right {
            transform: translateX(300px) translateY(-5px);
        }
        
        #menu-toggle {
            position: fixed;
            top: 130px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            background: #003366;
            color: white;
            padding: 20px;
            border-radius: 5px;
            z-index: 2001;
            transition: transform 0.3s ease;
        }
        
        #menu-toggle:hover {
            transform: scale(1.05);
        }
        
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100%;
            background: linear-gradient(180deg, #022548, #033a6b);
            padding-top: 80px;
            transition: all 0.3s ease;
            transform: translateX(-100%);
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        
        #sidebar.active {
            transform: translateX(0);
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        
        #sidebar .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        #sidebar .close-btn:hover {
            transform: scale(1.1);
        }
        
        .sidebar-links {
            margin-top: 100px;
        }
        
        .sidebar-item,
        .dropdown-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 25px;
            font-size: 19px;
            color: white;
            text-decoration: none;
            background: none;
            border: none;
            text-align: left;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        
        .sidebar-item:hover,
        .dropdown-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #00aaff;
            padding-left: 30px;
        }
        
        .dropdown-btn .arrow {
            margin-left: auto;
            transition: transform 0.3s ease;
        }
        
        .dropdown-section.active .arrow {
            transform: rotate(90deg);
        }
        
        .dropdown-content {
            background: #04407a;
            padding-left: 10px;
            border-left: 2px solid #007acc;
            display: none;
        }
        
        .dropdown-content a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            font-size: 17px;
            color: #e0e0e0;
            text-decoration: none;
            transition: background 0.3s;
        }
        
        .dropdown-content a:hover {
            background-color: #005fa3;
            color: #ffffff;
        }
        
        .dropdown-section.active .dropdown-content {
            display: block;
        }
        
        .logout-section {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
        }
        
        .logout-section .sidebar-item {
            justify-content: center;
            color: #ffffff;
            background-color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border-radius: 8px;
            margin: 0 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .logout-section .sidebar-item:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        h2 {
            margin-bottom: 25px;
            color: #003366;
            text-align: center;
            font-size: 32px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: bold;
            color: #003366;
            margin-bottom: 10px;
            font-size: 18px;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        label:focus-within {
            transform: scale(1.05);
            color: #00aaff;
        }
        
        input[type="text"],
        input[type="file"],
        input[type="number"],
        select {
            width: 100%;
            padding: 16px;
            border: 1px solid #003366;
            border-radius: 8px;
            background-color: #f9f9f9;
            color: #003366;
            font-size: 16px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            background-color: #e0f7fa;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 175, 255, 0.4);
            animation: focusWave 1.5s infinite;
        }
        
        @keyframes focusWave {
            0% {
                box-shadow: 0 0 10px rgba(0, 175, 255, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 175, 255, 0.5);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 10px rgba(0, 175, 255, 0.2);
                transform: scale(1);
            }
        }
        
        input::placeholder {
            color: #7a9abf;
        }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%204%205'%3E%3Cpath%20fill='%23003366'%20d='M2%200L0%202h4z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 12px;
        }
        
        button {
            background-color: #003366;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        
        button:hover {
            background-color: #002244;
        }
    </style>
</head>

<body>
    <img src="logoalg.png" alt="Algerie Telecom Logo" class="logo-background" id="logo" />
    <div id="menu-toggle" onclick="toggleSidebar()">☰</div>

    <div id="sidebar">
        <!-- Close Button -->
        <div class="close-btn" onclick="toggleSidebar()">×</div>

        <!-- Menu Title -->
        <div style="padding: 20px; font-size: 24px; color: white; font-weight: bold; text-align: center;">Menu</div>

        <div class="sidebar-links">
            <a href="home.html" class="sidebar-item"><i data-lucide="home"></i>Accueil</a>
            <a href="infor-personnel.html" class="sidebar-item"><i data-lucide="file-text"></i>Infos Personnelles</a>
            <a href="Inscription.html" class="sidebar-item"><i data-lucide="clipboard-edit"></i>Inscription du Projet</a>
            <a href="rancencement.html" class="sidebar-item"><i data-lucide="map-pin"></i>Récensement</a>
            <a href="Statistiaque.html" class="sidebar-item"><i data-lucide="bar-chart"></i>Statistiques</a>
            <a href="Visualisation.html" class="sidebar-item"><i data-lucide="satellite-dish"></i>Visualisation</a>

            <div class="dropdown-section">
                <button class="dropdown-btn"><i data-lucide="folder"></i>Projet <span class="arrow">▶</span></button>
                <div class="dropdown-content">
                    <a href="ajouter.html"><i data-lucide="plus-circle"></i>Ajouter</a>
                    <a href="modifier1.html"><i data-lucide="edit-3"></i>Modifier</a>
                    <a href="info-validation-project.html"><i data-lucide="info"></i>Informations</a>
                </div>
            </div>

            <div class="dropdown-section">
                <button class="dropdown-btn"><i data-lucide="user"></i>Utilisateur <span class="arrow">▶</span></button>
                <div class="dropdown-content">
                    <a href="validation-user.html"><i data-lucide="check-circle"></i>Validation</a>
                    <a href="affichage-user.html"><i data-lucide="eye"></i>Affichage</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Ajouter un Projet</h2>
        <form>
            <div class="form-group"><label>Région</label><select><option>Nord</option><option>Est</option><option>Sud</option><option>Ouest</option></select></div>
            <div class="form-group"><label>Code-Geomarketing</label><input type="number" /></div>
            <div class="form-group"><label>DOT</label><input type="text" /></div>

            <div class="form-group"><label>Adresse</label><input type="text" /></div>
            <div class="form-group"><label>Nom de localité</label><input type="text" /></div>
            <div class="form-group"><label>Type de construction</label><select><option>Collectifs</option><option>Individuelle</option></select></div>
            <div class="form-group"><label>Type de logement</label><select><option>Bâtiment</option><option>Pavillonnaire</option></select></div>
            <div class="form-group"><label>Latitude</label><input type="number" /></div>
            <div class="form-group"><label>Longitude</label><input type="number" /></div>
            <div class="form-group"><label>Type d'accès</label><input type="text" /></div>
            <div class="form-group"><label>Nombre de logements</label><input type="number" /></div>
            <div class="form-group"><label>Nombre de locaux commerciaux</label><input type="number" /></div>
            <div class="form-group"><label>Nombre de blocs</label><input type="number" /></div>
            <div class="form-group"><label>État d’avancement de construction</label><input type="text" /></div>
            <div class="form-group"><label>Taux d’occupation d’habitation</label><input type="number" /></div>
            <div class="form-group"><label>Statut de la canalisation</label><select><option>Réalisé</option><option>Non-Réalisé</option></select></div>
            <div class="form-group"><label>Type de technologie proposé par la DOT</label><select><option>FTTH</option></select></div>
            <div class="form-group"><label>Observation</label><select><option>Réalisé</option><option>Non-Réalisé</option></select></div>
            <button type="submit">Enregistrer</button>
        </form>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const logo = document.getElementById("logo");
            sidebar.classList.toggle("active");
            logo.classList.toggle("logo-move-right");
        }

        document.querySelectorAll('.dropdown-btn').forEach((btn) => {
            btn.addEventListener('click', function() {
                const section = this.parentElement;
                section.classList.toggle('active');
            });
        });

        lucide.createIcons();
    </script>
</body>

</html>
