<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Reset Successful - Algerie Telecom</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .logo-background {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 220px;
            z-index: 999;
            transition: transform 0.4s ease, top 0.4s ease;
        }
        
        .success-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        h2 {
            color: #003366;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 24px;
        }
        
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .home-btn {
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        .home-btn:hover {
            background-color: #003366;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <img src="logoalg.png" alt="Algerie Telecom Logo" class="logo-background" id="logo" />
    <div class="success-container">
        <h2>Password Reset Successful</h2>
        <p>Your password has been changed successfully. You can now log in with your new credentials.</p>
        <a href="home.html" class="home-btn">Return to Home</a>
    </div>
</body>

</html>
