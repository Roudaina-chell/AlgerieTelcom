            ;

    <!DOCTYPE html>
    <html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>insrciption</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background-color: #f4f7fb;
                margin: 0;
                padding: 2rem;
            }
            
            .form-container {
                background-color: white;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                max-width: 900px;
                margin: auto;
                padding: 2rem;
            }
            
            .form-title {
                font-size: 24px;
                font-weight: bold;
                color: #111827;
                border-bottom: 2px solid rgb(5, 6, 45);
                padding-bottom: 1rem;
                margin-bottom: 2rem;
            }
            
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            
            .form-group {
                display: flex;
                flex-direction: column;
            }
            
            label {
                margin-bottom: 0.5rem;
                font-weight: 500;
                color: #1f2937;
            }
            
            input,
            textarea {
                padding: 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.3s ease;
            }
            
            input:focus,
            textarea:focus {
                border-color: rgb(5, 6, 45);
                ;
            }
            
            textarea {
                resize: vertical;
                min-height: 100px;
            }
            
            .btn-submit {
                margin-top: 2rem;
                padding: 0.75rem 2rem;
                background-color: rgb(5, 6, 45);
                color: white;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }
            
            .return-button {
                position: fixed;
                bottom: 30px;
                right: 30px;
                align-items: center;
                background-image: linear-gradient(144deg, #1c0f59, #180f51 50%, #0d0b3c);
                border: 0;
                border-radius: 8px;
                box-shadow: rgba(18, 18, 88, 0.2) 0 15px 30px -5px;
                box-sizing: border-box;
                color: #ffffff;
                display: flex;
                font-size: 18px;
                justify-content: center;
                line-height: 1em;
                min-width: 140px;
                padding: 3px;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.3s;
                z-index: 1000;
            }
            
            .return-button span {
                background-color: rgb(5, 6, 45);
                padding: 16px 24px;
                border-radius: 6px;
                width: 100%;
                height: 100%;
                transition: 300ms;
            }
            
            .return-button:hover span {
                background: none;
            }
            
            .return-button:active {
                transform: scale(0.9);
            }
            
            .btn-submit:hover {
                background-color: rgb(5, 6, 45);
            }
            
            @media (max-width: 768px) {
                .form-grid {
                    grid-template-columns: 1fr;
                }
            }
            
            .logo {
                width: 120px;
            }
        </style>
    </head>

    <body>
        <img src="logoalg.png" alt="Logo" class="logo" />
        <div class="form-container">
            <div class="form-title">insrciption</div>
            <form>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="altitude">région</label>
                        <input type="text" id="altitude" name="altitude" required placeholder="Entrer la région">
                    </div>
                    <div class="form-group">
                        <label for="longitude">code-geomar</label>
                        <input type="text" id="longitude" name="longitude" required placeholder="Entrer le code-geomarketing">
                    </div>
                    <div class="form-group">
                        <label for="nbr-logement">Dot</label>
                        <input type="text" id="nbr-logement" name="nbr-logement" required placeholder="Entrer le dot">
                    </div>
                    <div class="form-group">
                        <label for="formule-logement">commune</label>
                        <input type="text" id="formule-logement" name="formule-logement" required placeholder="Entrer la commune">
                    </div>
                    <div class="form-group">
                        <label for="locaux-commerciaux">Nom de localité</label>
                        <input type="text" id="locaux-commerciaux" name="locaux-commerciaux" required placeholder="Entrer le nom de localité">
                    </div>
                    <div class="form-group">
                        <label for="nbr-bloc">Adresse</label>
                        <input type="text" id="nbr-bloc" name="nbr-bloc" required placeholder="Entrer l'adresse ">
                    </div>

                </div>
                <button type="submit" class="btn-submit">Enreg</button>
            </form>
            <button class="return-button" onclick="goBack()">
        <span class="text">Retour</span>
      </button>
        </div>

    </body>

    </html>
    <script>
        function goBack() {
            window.location.href = "commercial.html";
        }
    </script>

</body>
